<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mirror Opens — Palace Entry V3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #090909;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    }

    .scene {
      position: relative;
      width: 390px; height: 844px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }

    /* Reflected light — starts dark, reveals */
    .light-band {
      position: absolute;
      top: 0; left: -100%; right: -100%;
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(216,179,106,0.05) 20%,
        rgba(216,179,106,0.35) 50%,
        rgba(216,179,106,0.05) 80%,
        transparent 100%
      );
      top: 50%; transform: translateY(-50%);
      animation: light-sweep 2.5s ease-out 0.5s forwards;
      opacity: 0;
    }

    @keyframes light-sweep {
      0%   { opacity: 0; left: -100%; }
      20%  { opacity: 1; }
      80%  { opacity: 0.6; }
      100% { opacity: 0; left: 100%; }
    }

    /* Mirror surface */
    .mirror {
      position: relative;
      width: 220px; height: 220px;
      border-radius: 50%;
      border: 1.5px solid rgba(216,179,106,0.25);
      display: flex; align-items: center; justify-content: center;
      animation: mirror-appear 1.2s cubic-bezier(0.16,1,0.3,1) 0.3s backwards;
    }

    @keyframes mirror-appear {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .mirror-inner {
      width: 170px; height: 170px;
      border-radius: 50%;
      border: 1px solid rgba(216,179,106,0.40);
      background: radial-gradient(circle, rgba(216,179,106,0.08) 0%, transparent 70%);
      display: flex; align-items: center; justify-content: center;
    }

    .mirror-orbit {
      position: absolute;
      width: 220px; height: 220px;
      border-radius: 50%;
      border: 1px dashed rgba(216,179,106,0.12);
      animation: orbit-rotate 20s linear infinite;
    }

    @keyframes orbit-rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Five planet dots — appear sequentially */
    .planet {
      position: absolute;
      width: 12px; height: 12px;
      border-radius: 50%;
      opacity: 0;
      box-shadow: 0 0 8px currentColor;
    }

    .planet:nth-child(1) { background: #C87A8A; top: 10px;   left: 50%; margin-left: -6px; animation: dot-appear 0.5s ease-out 1.0s forwards; }
    .planet:nth-child(2) { background: #A8B8C8; top: 35%;   left: 5px;                      animation: dot-appear 0.5s ease-out 1.38s forwards; }
    .planet:nth-child(3) { background: #6A6A7A; bottom: 35%; left: 12px;                     animation: dot-appear 0.5s ease-out 1.76s forwards; }
    .planet:nth-child(4) { background: #5A8A7A; bottom: 35%; right: 12px;                    animation: dot-appear 0.5s ease-out 2.14s forwards; }
    .planet:nth-child(5) { background: #E8C040; top: 35%;   right: 5px;                      animation: dot-appear 0.5s ease-out 2.52s forwards; }

    @keyframes dot-appear {
      from { opacity: 0; transform: scale(0.3); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Connection lines */
    .connections {
      position: absolute;
      width: 100%; height: 100%;
      opacity: 0;
      animation: connections-appear 1s ease-out 2.8s forwards;
    }

    @keyframes connections-appear {
      from { opacity: 0; }
      to   { opacity: 0.25; }
    }

    .connections svg {
      width: 100%; height: 100%;
    }

    /* Recognition phrase */
    .phrase {
      position: absolute;
      bottom: 120px;
      left: 40px; right: 40px;
      text-align: center;
      opacity: 0;
      animation: phrase-appear 1.2s cubic-bezier(0.16,1,0.3,1) 3.5s forwards;
    }

    @keyframes phrase-appear {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .phrase-label {
      font-size: 10px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      color: #D8B36A; margin-bottom: 12px;
    }

    .phrase-text {
      font-size: 17px; font-weight: 400;
      line-height: 1.65;
      color: #F4EFE4;
    }

    /* Bottom badge */
    .badge {
      position: absolute;
      bottom: 60px;
      display: flex; align-items: center; gap: 8px;
      opacity: 0;
      animation: phrase-appear 0.8s ease-out 5.5s forwards;
    }

    .badge-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #D8B36A;
    }

    .badge-text {
      font-size: 10px; font-weight: 600;
      letter-spacing: 2px; color: #D8B36A;
      text-transform: uppercase;
    }

    /* Glow halo */
    .glow {
      position: absolute;
      width: 300px; height: 300px; border-radius: 50%;
      background: radial-gradient(circle, rgba(216,179,106,0.06) 0%, transparent 70%);
      pointer-events: none;
      animation: glow-pulse 3s ease-in-out 1s infinite alternate;
    }

    @keyframes glow-pulse {
      from { transform: scale(0.9); opacity: 0.5; }
      to   { transform: scale(1.1); opacity: 1; }
    }

    /* Storyboard overlay */
    .storyboard {
      position: fixed;
      top: 16px; right: 16px;
      font-size: 10px; color: rgba(216,179,106,0.4);
      font-family: monospace;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="scene">
    <!-- Reflected light sweep -->
    <div class="light-band"></div>

    <!-- Glow halo -->
    <div class="glow"></div>

    <!-- Mirror -->
    <div class="mirror">
      <div class="mirror-orbit"></div>
      <div class="mirror-inner">
        <!-- Five planet dots -->
        <div class="planet"></div>
        <div class="planet"></div>
        <div class="planet"></div>
        <div class="planet"></div>
        <div class="planet"></div>

        <!-- Connection lines -->
        <div class="connections">
          <svg viewBox="0 0 170 170">
            <line x1="85" y1="10" x2="10" y2="60" stroke="#D8B36A" stroke-width="0.8"/>
            <line x1="10" y1="60" x2="20" y2="130" stroke="#D8B36A" stroke-width="0.8"/>
            <line x1="20" y1="130" x2="150" y2="130" stroke="#D8B36A" stroke-width="0.8"/>
            <line x1="150" y1="130" x2="160" y2="60" stroke="#D8B36A" stroke-width="0.8"/>
            <line x1="160" y1="60" x2="85" y2="10" stroke="#D8B36A" stroke-width="0.8"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Recognition phrase -->
    <div class="phrase">
      <div class="phrase-label">Первое зеркало</div>
      <div class="phrase-text">
        Есть повторяющийся маршрут.<br>
        Как вы чувствуете, действуете,<br>
        теряете силу — и к чему приходите.
      </div>
    </div>

    <!-- Badge -->
    <div class="badge">
      <div class="badge-dot"></div>
      <div class="badge-text">Зеркало себя · V3</div>
    </div>
  </div>

  <!-- Storyboard -->
  <div class="storyboard">
    0.0s — dark surface<br>
    0.5s — light sweep<br>
    0.3s — mirror opens<br>
    1.0s — five dots appear<br>
    2.8s — connections form<br>
    3.5s — recognition phrase<br>
    5.5s — badge<br>
    8.0s — composition holds
  </div>
</body>
</html>
